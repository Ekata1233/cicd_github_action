name: Deploy Dist

on:
  push:
    branches:
      - main
      - 'feature/*'
    paths-ignore:
      - '.github/workflows/*'
      - 'README.md'
  workflow_dispatch:     
jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path:  ~/.npm
          # ubuntu-node-231234234
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}



      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  build:
    needs: greet
    runs-on: ubuntu-latest      
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Dependencies
        uses: actions/cache@v6
        with:
          path:  ~/.npm
          # ubuntu-node-231234234
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}    

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist
      - name: Deploy
        run: echo "Deploy Successfull"

 